name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: "Also run the real-toolchain integration tests (slow)"
        type: boolean
        default: false

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]     # linux-64 and osx-arm64, the two locked platforms
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: dev
          locked: true
      - run: pixi run -e dev ruff check src tests
      - run: pixi run -e dev pytest                  # fake toolchain: fast
      - run: pixi run doctor                         # the real tools are present and found
      - run: pixi run meg plan examples/ttbar_nlo_herwig7.toml

  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: dev
          locked: true
      - run: pixi run -e dev meg setup
      - run: pixi run -e dev pytest -m integration -x
