# MEG toolchain: everything comes from conda-forge, locked in pixi.lock for linux-64 and osx-arm64.
# Mutable things (UFO models, PDF sets) are NOT in the environment; they live in the MEG cache.
[workspace]
name = "meg"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.11.*"
pydantic = ">=2"
numpy = "*"
uproot = "*"            # reads the Delphes ROOT output for the run manifest (no ROOT needed)
awkward = "*"           # jagged arrays: how uproot and pylhe hand over events (used in docs/tutorial-interactive-madgraph.md)
vector = "*"            # four-vector arithmetic on those arrays
pylhe = ">=2"           # reads LHE files from Python (the tutorial's examples need the 2.x interface)
matplotlib = "*"        # plots in the tutorial
mplhep = "*"            # HEP plotting styles and histogram helpers on top of matplotlib
mg5amcnlo = "*"
pythia8 = ">=8.3"
herwig = "*"
lhapdf = ">=6.5"
fastjet = ">=3.4"
delphes = ">=3.5"
hepmc2 = "*"
# MG5 compiles process-specific Fortran/C++ at run time and links it against the libraries above,
# so the compilers must come from the same environment.
c-compiler = "*"
cxx-compiler = "*"
fortran-compiler = "*"
make = "*"
patch = "*"
curl = "*"
wget = "*"
git = "*"               # model fetching (sparse, pinned git fetch)
# GNU userland so behaviour is the same on Linux and macOS.
bash = "*"
coreutils = "*"
gzip = "*"
sed = "*"
tar = "*"

[pypi-dependencies]
meg = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = "*"
ruff = "*"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tasks]
doctor = "meg doctor"
mg5 = "meg mg5"            # interactive MG5 prompt, same environment fixes as `meg generate`; output in ./work
setup = "meg setup"
test = { cmd = "pytest", default-environment = "dev" }
